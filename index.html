.title-input { background: none; border: none; border-bottom: 2px solid #E8624A; color: #fff; font-size: 20px; font-weight: 700; outline: none; flex: 1; }

.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex-shrink: 0; background: none; border: none; border-bottom: 3px solid transparent; padding: 13px 16px; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.tab-btn.active { border-bottom-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.tab-add { flex-shrink: 0; background: none; border: none; color: #444; padding: 13px 12px; font-size: 22px; cursor: pointer; }

.main { padding: 20px; max-width: 760px; margin: 0 auto; padding-bottom: 60px; }

.city-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.city-title { display: flex; align-items: center; gap: 10px; }
.city-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.city-name { font-size: 24px; font-weight: 700; }
.icon-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 15px; padding: 4px 6px; }

.panel { margin-bottom: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #222; background: #111; }
.panel.filled { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 8%, #0E0E12); }
.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; }
.panel-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.panel-title.empty { color: #555; }
.panel-title.filled { color: #eee; }
.panel-hint { font-size: 11px; color: #444; font-style: italic; }
.panel-actions { display: flex; align-items: center; gap: 8px; }
.panel-edit { background: none; border: none; color: #555; cursor: pointer; font-size: 12px; padding: 3px 8px; }
.panel-chevron { color: #444; font-size: 11px; }
.panel-body { padding: 4px 14px 14px; border-top: 1px solid #1e1e26; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; margin-top: 10px; }
.info-field { margin-bottom: 10px; }
.info-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #666; margin-bottom: 3px; }
.info-value { font-size: 14px; color: #ddd; }
.info-value.mono { font-family: monospace; background: #0a0a0e; padding: 3px 7px; border-radius: 5px; display: inline-block; }
.info-link { color: #4A90E2; text-decoration: none; font-size: 14px; border-bottom: 1px dashed rgba(74,144,226,0.3); display: inline-flex; align-items: center; gap: 4px; }

.day-block { margin-bottom: 24px; }
.day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }

.activity { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; background: #111; border-radius: 10px; margin-bottom: 7px; border: 1px solid #222; transition: border-color 0.15s; cursor: grab; user-select: none; }
.activity:active { cursor: grabbing; }
.activity-drag { color: #333; font-size: 16px; margin-top: 2px; flex-shrink: 0; }

.activity-body { flex: 1; min-width: 0; }
.activity-title { color: #eee; font-weight: 600; font-size: 14px; }
.activity-notes { color: #666; font-size: 12px; margin-top: 3px; }
.activity-link { font-size: 11px; text-decoration: none; margin-top: 4px; display: block; }
.activity-actions { display: flex; gap: 2px; flex-shrink: 0; }

.empty-icon { font-size: 32px; margin-bottom: 10px; }
.empty-acts { padding: 16px; text-align: center; color: #444; border: 1px dashed #222; border-radius: 8px; font-size: 13px; }
.empty-link { cursor: pointer; text-decoration: underline; }
.empty-city { text-align: center; padding: 70px 0; color: #444; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 600px) { .modal-overlay { align-items: center; } }
.modal { background: #1C1C22; border: 1px solid #2a2a35; border-radius: 20px 20px 0 0; padding: 28px 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.btn { border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.2px; border: none; padding: 10px 18px; transition: opacity 0.15s; -webkit-tap-highlight-color: transparent; }

function calcActivityEndTime(start, dur) {
  if (!start || !dur) return null;
  const startMatch = start.match(/(\d+):(\d+)\s*(AM|PM)/i);
  const durMatch = dur.match(/(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?/i);
  if (!startMatch || !durMatch || (!durMatch[1] && !durMatch[2])) return null;
  let h = parseInt(startMatch[1]);
  const m = parseInt(startMatch[2]);
  const ampm = startMatch[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  let totalMins = h * 60 + m;
  totalMins += (parseInt(durMatch[1] || 0)) * 60 + parseInt(durMatch[2] || 0);
  const endH = Math.floor(totalMins / 60) % 24;
  const endM = totalMins % 60;
  const endAmpm = endH >= 12 ? 'PM' : 'AM';
  const displayH = endH % 12 || 12;
  return `${displayH}:${String(endM).padStart(2,'0')} ${endAmpm}`;
}

    eurInput.addEventListener('input', () => { currencyState.eurValue = eurInput.value; convert(); });
    eurWrap.appendChild(eurInput);

    const select = document.createElement('select');
    select.className = 'form-select';
    select.setAttribute('style', 'flex:1;max-width:160px');
    targetCurrencies.forEach(opt => {
      const o = el('option', { value: opt.code }, `${opt.symbol} ${opt.name}`);
      if (opt.code === currencyState.selectedCode) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', () => { currencyState.selectedCode = select.value; convert(); });
    row.appendChild(select);
    body.appendChild(row);

    const result = el('div', { style: 'margin-top:12px;text-align:center;font-size:26px;font-weight:700;color:#E8624A;min-height:36px;letter-spacing:-0.5px' }, '');

    body.appendChild(result);
    body.appendChild(rateNote);

    function convert() {
      const eur = parseFloat(eurInput.value);
      const code = select.value;
      const cur = targetCurrencies.find(o => o.code === code);
      if (!cur || isNaN(eur) || eurInput.value === '') { result.textContent = ''; rateNote.textContent = ''; return; }
      result.textContent = `${cur.symbol}${(eur * cur.rate).toFixed(2)} ${cur.code}`;

    }

    if (currencyState.eurValue) convert();
    panel.appendChild(body);
  }

  return panel;
}

                { label: '🗺 Google', href: `https://www.google.com/maps/dir/?api=1&destination=${encoded}` },
                { label: '🍎 Apple',  href: `http://maps.apple.com/?daddr=${encoded}` },
                { label: '🔵 Waze',   href: `https://waze.com/ul?q=${encoded}&navigate=yes` },
              ].forEach(m => {
                const btn = document.createElement('a');
                btn.setAttribute('href', m.href);
                btn.setAttribute('target', '_blank');
                btn.setAttribute('rel', 'noopener noreferrer');
                btn.setAttribute('style', 'font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;background:#1e1e28;border:1px solid #333;color:#aaa;text-decoration:none;white-space:nowrap;display:inline-block;');
                btn.textContent = m.label;
                mapBtns.appendChild(btn);
              });
              addrWrap.appendChild(mapBtns);
              itemEl.appendChild(addrWrap);
            }

            catWrap.appendChild(itemEl);
          });
        }
      }

      body.appendChild(catWrap);
    });

    panel.appendChild(body);
  }
  return panel;
}

// ── Weather ──
const CITY_COORDS = {
  'Rome':        { lat: 41.9028, lon: 12.4964 },
  'Riomaggiore': { lat: 44.0993, lon: 9.7371  },
  'Florence':    { lat: 43.7696, lon: 11.2558 },
  'Dublin':      { lat: 53.3498, lon: -6.2603 },
};

const weatherCache = {};
const geocodeCache = {};

async function getCoords(cityName) {
  if (CITY_COORDS[cityName]) return CITY_COORDS[cityName];
  if (geocodeCache[cityName]) return geocodeCache[cityName];
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const coords = { lat: data.results[0].latitude, lon: data.results[0].longitude };
      geocodeCache[cityName] = coords;
      return coords;
    }
  } catch(e) {}
  return null;
}

const WMO_CODES = {
  0:'Clear',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Icy Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',71:'Light Snow',73:'Snow',75:'Heavy Snow',
  80:'Showers',81:'Heavy Showers',95:'Thunderstorm',96:'Hail Storm',99:'Heavy Hail',
};
const WMO_ICONS = {
  0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',
  51:'🌦',53:'🌦',55:'🌧',61:'🌦',63:'🌧',65:'🌧',
  71:'🌨',73:'❄️',75:'❄️',80:'🌧',81:'🌧',95:'⛈',96:'⛈',99:'⛈',
};

function getWMOIcon(code) { return WMO_ICONS[code] || '🌡'; }
function getWMODesc(code) { return WMO_CODES[code] || 'Unknown'; }

async function fetchWeather(cityName) {
  const now = Date.now();
  if (weatherCache[cityName] && now - weatherCache[cityName].ts < 15 * 60 * 1000) {
    return weatherCache[cityName].data;
  }
  try {
    const coords = await getCoords(cityName);
    if (!coords) return null;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch`;
    const res = await fetch(url);
    const data = await res.json();
    weatherCache[cityName] = { ts: now, data };
    return data;
  } catch(e) {
    return null;
  }
}

function renderWeatherPanel(city) {
  const panelKey = city.id + '_weather';
  const isOpen = !!state.openPanels[panelKey];
  const viewKey = city.id + '_weather_view';
  const weatherView = state.openPanels[viewKey] || 'hourly';

  const panel = el('div', { className: 'panel', style: `--pc:${city.color};border-color:${city.color}44;background:linear-gradient(135deg,#1a1a28,#0f1520)` });
  const header = el('div', { className: 'panel-header' });
  const titleDiv = el('div', { className: 'panel-title filled' });
  titleDiv.appendChild(el('span', { style: 'font-size:16px' }, '🌤'));
  titleDiv.appendChild(el('span', {}, `${city.name} Weather`));
  header.appendChild(titleDiv);
  const chev = el('span', { className: 'panel-chevron' }, isOpen ? '▲' : '▼');
  header.appendChild(chev);
  header.addEventListener('click', () => {
    state.openPanels[panelKey] = !isOpen;
    render();
  });
  panel.appendChild(header);

  if (isOpen) {
    const body = el('div', { className: 'panel-body' });
    const cached = weatherCache[city.name];

    if (cached && cached.error) {
      body.appendChild(el('div', { style: 'padding:16px 0;color:#555;font-size:13px;text-align:center' }, '⚠️ Unable to load weather. Check connection.'));
    } else if (cached && cached.data) {
      body.appendChild(buildWeatherContent(city.name, cached.data, weatherView));
    } else {
      const loading = el('div', { style: 'display:flex;align-items:center;gap:8px;padding:16px 0;color:#444;font-size:13px' });
      const spinner = el('div', { style: 'width:16px;height:16px;border:2px solid #333;border-top-color:'+city.color+';border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0' });
      loading.appendChild(spinner);
      loading.appendChild(el('span', {}, 'Fetching live weather…'));
      body.appendChild(loading);
      fetchWeather(city.name).then(data => {
        if (data) {
          render();
        } else {
          // Store error sentinel so we don't retry endlessly
          weatherCache[city.name] = { ts: Date.now(), data: null, error: true };
          render();
        }
      });
    }

    panel.appendChild(body);
  }
  return panel;
}

function buildWeatherContent(cityName, data, weatherView) {
  const frag = document.createDocumentFragment();
  const c = data.current;
  const nowHour = new Date().getHours();

  // Current conditions
  const cur = el('div', { style: 'display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;border-bottom:1px solid #1e1e26;margin-bottom:12px' });
  const curLeft = el('div', { style: 'display:flex;align-items:center;gap:10px' });
  curLeft.appendChild(el('div', { style: 'font-size:38px;line-height:1' }, getWMOIcon(c.weather_code)));
  const tempWrap = el('div', { style: 'display:flex;align-items:flex-start;gap:2px' });
  tempWrap.appendChild(el('div', { style: 'font-size:42px;font-weight:700;color:#fff;letter-spacing:-2px;line-height:1' }, Math.round(c.temperature_2m) + ''));
  tempWrap.appendChild(el('div', { style: 'font-size:18px;color:#666;margin-top:5px' }, '°F'));
  curLeft.appendChild(tempWrap);
  cur.appendChild(curLeft);
  const curRight = el('div', { style: 'text-align:right' });
  curRight.appendChild(el('div', { style: 'font-size:14px;color:#aaa;margin-bottom:3px;font-weight:500' }, getWMODesc(c.weather_code)));
  curRight.appendChild(el('div', { style: 'font-size:12px;color:#555' }, `Feels like ${Math.round(c.apparent_temperature)}°F`));
  curRight.appendChild(el('div', { style: `font-size:11px;color:#E8624A;font-weight:600;letter-spacing:0.5px;margin-top:2px` }, cityName.toUpperCase()));
  cur.appendChild(curRight);
  frag.appendChild(cur);

  // Stats row
  const stats = el('div', { style: 'display:flex;gap:6px;margin-bottom:12px' });
  [
    { icon:'💧', val:`${c.relative_humidity_2m}%`, label:'Humidity' },
    { icon:'💨', val:`${Math.round(c.wind_speed_10m)} mph`, label:'Wind' },
    { icon:'🌧', val:`${c.precipitation_probability ?? 0}%`, label:'Rain' },
  ].forEach(s => {
    const stat = el('div', { style: 'flex:1;background:#111;border:1px solid #1e1e26;border-radius:10px;padding:8px 6px;text-align:center' });
    stat.appendChild(el('div', { style: 'font-size:15px;margin-bottom:3px' }, s.icon));
    stat.appendChild(el('div', { style: 'font-size:12px;font-weight:700;color:#ddd;margin-bottom:2px' }, s.val));
    stat.appendChild(el('div', { style: 'font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.5px' }, s.label));
    stats.appendChild(stat);
  });
  frag.appendChild(stats);

  // View switcher
  const viewTabs = el('div', { style: 'display:flex;background:#111;border:1px solid #1e1e26;border-radius:10px;padding:3px;margin-bottom:12px;gap:2px' });
  ['hourly','5-day'].forEach(v => {
    const btn = el('button', { style: `flex:1;border:none;border-radius:8px;font-size:12px;font-weight:600;padding:7px 0;cursor:pointer;transition:all 0.15s;${weatherView===v?'background:#E8624A;color:#fff':'background:none;color:#555'}` }, v === 'hourly' ? 'Hourly' : '5-Day');
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const city_ = state.data.cities.find(ct => ct.name === cityName);
      if (city_) { state.openPanels[city_.id + '_weather_view'] = v; render(); }
    });
    viewTabs.appendChild(btn);
  });
  frag.appendChild(viewTabs);

  if (weatherView === 'hourly') {
    // Hourly scroll — next 12 hours
    const scroll = el('div', { style: 'display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none' });
    const hours = data.hourly;
    // Parse hour directly from ISO string to avoid timezone offset issues
    let startIdx = hours.time.findIndex(t => parseInt(t.slice(11, 13)) >= nowHour);
    if (startIdx < 0) startIdx = 0;
    const sliceEnd = Math.min(startIdx + 12, hours.time.length);
    for (let i = startIdx; i < sliceEnd; i++) {
      const isNow = i === startIdx;
      const h = parseInt(hours.time[i].slice(11, 13));
      const label = isNow ? 'NOW' : (h === 0 ? '12AM' : h < 12 ? `${h}AM` : h === 12 ? '12PM' : `${h-12}PM`);
      const card = el('div', { style: `flex-shrink:0;background:#111;border:1px solid ${isNow?'#E8624A':'#1e1e26'};${isNow?'background:rgba(232,98,74,0.08);':''}border-radius:12px;padding:10px 8px;text-align:center;min-width:55px` });
      card.appendChild(el('div', { style: `font-size:11px;font-weight:600;margin-bottom:5px;${isNow?'color:#E8624A':'color:#555'}` }, label));
      card.appendChild(el('div', { style: 'font-size:18px;margin-bottom:5px' }, getWMOIcon(hours.weather_code[i])));
      card.appendChild(el('div', { style: 'font-size:13px;font-weight:700;color:#eee;margin-bottom:3px' }, Math.round(hours.temperature_2m[i]) + '°F'));
      card.appendChild(el('div', { style: 'font-size:10px;color:#4A90E2' }, `💧${hours.precipitation_probability[i]}%`));
      scroll.appendChild(card);
    }
    frag.appendChild(scroll);
  } else {
    // 5-day forecast
    const daily = data.daily;
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (let i = 0; i < 5; i++) {
      const parts = daily.time[i].split('-');
      const dayOfWeek = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2])).getDay();
      const row = el('div', { style: 'display:flex;align-items:center;background:#111;border:1px solid #1e1e26;border-radius:10px;padding:10px 12px;margin-bottom:6px;gap:10px' });
      row.appendChild(el('div', { style: 'font-size:13px;font-weight:600;color:#aaa;width:32px;flex-shrink:0' }, i === 0 ? 'Today' : days[dayOfWeek]));
      row.appendChild(el('div', { style: 'font-size:20px;flex-shrink:0' }, getWMOIcon(daily.weather_code[i])));
      row.appendChild(el('div', { style: 'flex:1;font-size:12px;color:#555' }, getWMODesc(daily.weather_code[i])));
      const temps = el('div', { style: 'display:flex;gap:6px;align-items:center;flex-shrink:0' });
      temps.appendChild(el('div', { style: 'font-size:13px;font-weight:700;color:#eee' }, Math.round(daily.temperature_2m_max[i]) + '°F'));
      temps.appendChild(el('div', { style: 'font-size:12px;color:#444' }, Math.round(daily.temperature_2m_min[i]) + '°F'));
      row.appendChild(temps);
      row.appendChild(el('div', { style: 'font-size:11px;color:#4A90E2;width:30px;text-align:right;flex-shrink:0' }, `💧${daily.precipitation_probability_max[i]}%`));
      frag.appendChild(row);
    }
  }

  return frag;
}

function renderActivity(city, day, act) {
  const panelKey = act.id + '_open';
  const isOpen = !!state.openPanels[panelKey];
  const hasDetails = !!(act.notes || act.link || act.address || (act.files && act.files.length));
  const canExpand = hasDetails || authState.editing;

  const wrapper = el('div', { style: 'margin-bottom:7px' });

  const row = el('div', { className: 'activity', draggable: 'true', style: 'margin-bottom:0;border-radius:' + (isOpen && canExpand ? '10px 10px 0 0' : '10px') });
  row.style.borderColor = '#222';

  row.addEventListener('mouseenter', () => row.style.borderColor = city.color);
  row.addEventListener('mouseleave', () => { if (!isOpen) row.style.borderColor = '#222'; });
  row.addEventListener('touchstart', () => {}, { passive: true });

  row.addEventListener('dragstart', e => {
    state.dragSrc = { cityId: city.id, dayId: day.id, actId: act.id };
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  row.addEventListener('dragend', () => row.classList.remove('dragging'));
  row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', e => {
    e.preventDefault();
    row.classList.remove('drag-over');
    const src = state.dragSrc;
    if (!src || src.actId === act.id || src.dayId !== day.id) return;
    const acts = day.activities;
    const fromIdx = acts.findIndex(a => a.id === src.actId);
    const toIdx = acts.findIndex(a => a.id === act.id);
    const [moved] = acts.splice(fromIdx, 1);
    acts.splice(toIdx, 0, moved);
    state.dragSrc = null;
    save(); render();
  });

  row.appendChild(el('div', { className: 'activity-drag' }, '⠿'));

  // Time display — show start + end time if duration set
  const timeDiv = el('div', { className: 'activity-time', style: `color:${city.color}` });
  if (act.time && act.duration) {
    const endTime = calcActivityEndTime(act.time, act.duration);
    if (endTime) {
      timeDiv.appendChild(el('div', {}, act.time));
      const endDiv = el('div', { style: 'font-size:10px;opacity:0.75;margin-top:1px' }, `→ ${endTime}`);
      timeDiv.appendChild(endDiv);
    } else {
      timeDiv.textContent = act.time || '–';
    }
  } else {
    timeDiv.textContent = act.time || '–';
  }
  row.appendChild(timeDiv);

  const body = el('div', { className: 'activity-body' });
  body.appendChild(el('div', { className: 'activity-title' }, act.title));
  row.appendChild(body);

  const rightSide = el('div', { style: 'display:flex;align-items:center;gap:4px;flex-shrink:0' });

  if (authState.editing) {
    const editBtn = el('button', { className: 'icon-btn' }, '✏️');
    editBtn.addEventListener('click', e => { e.stopPropagation(); openModal('editActivity', { cityId: city.id, dayId: day.id, activity: act }); });
    rightSide.appendChild(editBtn);
  }

  if (canExpand) {
    const chev = el('span', { style: 'color:#555;font-size:11px;padding:2px 4px;cursor:pointer' }, isOpen ? '▲' : '▼');
    chev.addEventListener('click', e => {
      e.stopPropagation();
      state.openPanels[panelKey] = !isOpen;
      render();
    });
    rightSide.appendChild(chev);
  }
  row.appendChild(rightSide);

  if (canExpand) {
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => {
      state.openPanels[panelKey] = !isOpen;
      render();
    });
  }

  wrapper.appendChild(row);

  if (isOpen && canExpand) {
    const details = el('div', { style: `background:#111;border:1px solid ${city.color}55;border-top:none;border-radius:0 0 10px 10px;padding:10px 14px` });
    if (act.address) {
      const addrLabel = el('div', { style: 'font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#666;margin-bottom:4px' }, 'Address');
      details.appendChild(addrLabel);

      const allAddresses = [
        { label: act.addressLabel || null, addr: act.address },
        ...((act.extraAddresses || []))
      ];

      allAddresses.forEach(({ label: addrName, addr }) => {
        const addrWrap = el('div', { style: 'margin-bottom:8px' });
        if (addrName) addrWrap.appendChild(el('div', { style: 'font-size:11px;color:#666;margin-bottom:2px' }, addrName));
        addrWrap.appendChild(el('div', { style: 'font-size:13px;color:#ddd;margin-bottom:4px' }, addr));
        const mapBtns = el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' });
        const encoded = encodeURIComponent(addr);
        [
          { label: '🗺 Google', href: `https://www.google.com/maps/dir/?api=1&destination=${encoded}` },
          { label: '🍎 Apple',  href: `http://maps.apple.com/?daddr=${encoded}` },
          { label: '🔵 Waze',   href: `https://waze.com/ul?q=${encoded}&navigate=yes` },
        ].forEach(m => {
          const btn = document.createElement('a');
          btn.setAttribute('href', m.href);
          btn.setAttribute('target', '_blank');
          btn.setAttribute('rel', 'noopener noreferrer');
          btn.setAttribute('style', 'font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;background:#1e1e28;border:1px solid #333;color:#aaa;text-decoration:none;white-space:nowrap;display:inline-block;');
          btn.textContent = m.label;
          mapBtns.appendChild(btn);
        });
        addrWrap.appendChild(mapBtns);
        details.appendChild(addrWrap);
      });
    }
    if (act.notes) {
      const notesEl = el('div', { style: 'color:#bbb;font-size:13px;line-height:1.6;white-space:pre-wrap' }, act.notes);
      details.appendChild(notesEl);
    }
    if (act.link) {
      const link = document.createElement('a');
      link.setAttribute('href', act.link);
      link.setAttribute('target', '_blank');
      link.setAttribute('rel', 'noopener noreferrer');
      link.setAttribute('style', `color:${city.color};margin-top:6px;display:block;font-size:12px;text-decoration:none`);
      link.textContent = '🔗 ' + act.link.replace(/^https?:\/\//, '').slice(0, 50);
      details.appendChild(link);
    }
    // Attachments
    if (act.files && act.files.length > 0) {
      const attLabel = el('div', { style: 'font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#666;margin-bottom:6px;margin-top:8px' }, 'Attachments');
      details.appendChild(attLabel);
      const attRow = el('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px' });
      act.files.forEach(f => {
        const thumb = el('div', { style: 'cursor:pointer;position:relative' });

        if (f.type && f.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.setAttribute('style', 'width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #333;display:block');
          img.src = f.url || f.data || '';
          thumb.appendChild(img);
          thumb.addEventListener('click', () => openFileViewer(f));
        } else {
          thumb.setAttribute('style', 'cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:70px;border-radius:8px;border:1px solid #333;background:#1e1e28;gap:4px');
          const icon = el('div', {}, '📄');
          icon.style.fontSize = '24px';
          const label = el('div', {}, (f.name || 'file').slice(0, 12));
          label.style.cssText = 'font-size:9px;color:#888;text-align:center;word-break:break-all;padding:0 4px';
          thumb.appendChild(icon);
          thumb.appendChild(label);
          thumb.addEventListener('click', () => openFileViewer(f));
        }
        attRow.appendChild(thumb);
      });
      details.appendChild(attRow);
    }
    // Delete only shown in edit mode
    if (authState.editing) {
      const delRow = el('div', { style: 'margin-top:10px;padding-top:8px;border-top:1px solid #1e1e26;display:flex;justify-content:flex-end' });
      const delBtn = el('button', { style: 'background:none;border:1px solid #3a1a1a;border-radius:6px;color:#884444;font-size:12px;padding:5px 12px;cursor:pointer;' }, '🗑 Delete');
      let confirmPending = false;
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirmPending) {
          confirmPending = true;
          delBtn.textContent = 'Tap again to confirm';
          delBtn.style.background = '#3a1a1a';
          delBtn.style.color = '#cc5555';
          delBtn.style.borderColor = '#cc5555';
          setTimeout(() => {
            confirmPending = false;
            if (delBtn.isConnected) {
              delBtn.textContent = '🗑 Delete';
              delBtn.style.background = 'none';
              delBtn.style.color = '#884444';
              delBtn.style.borderColor = '#3a1a1a';
            }
          }, 3000);
        } else {
          day.activities = day.activities.filter(a => a.id !== act.id);
          save(); render();
        }
      });
      delRow.appendChild(delBtn);
      details.appendChild(delRow);
    }
    wrapper.appendChild(details);
  }

  return wrapper;
}

// ── Modals ──
function openModal(type, payload = {}) {
  state.modal = { type, payload };
  render();
}

function closeModal() {
  state.modal = null;
  render();
}

function renderModal() {
  const { type, payload } = state.modal;
  const overlay = el('div', { className: 'modal-overlay' });
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  const modal = el('div', { className: 'modal' });

  if (type === 'addCity') modal.appendChild(renderAddCityModal());
  else if (type === 'editCity') modal.appendChild(renderEditCityModal(payload.city));
  else if (type === 'addDay') modal.appendChild(renderAddDayModal(payload.cityId));
  else if (type === 'editDay') modal.appendChild(renderEditDayModal(payload.cityId, payload.dayId));
  else if (type === 'editActivity') modal.appendChild(renderActivityModal(payload));
  else if (type === 'editTransport') modal.appendChild(renderTransportModal(payload.cityId));
  else if (type === 'editAccom') modal.appendChild(renderAccomModal(payload.cityId));
  else if (type === 'editThingToDo') modal.appendChild(renderThingToDoModal(payload));

  overlay.appendChild(modal);
  return overlay;
}

function renderAddCityModal() {
  const frag = document.createDocumentFragment();
  frag.appendChild(el('h3', {}, 'Add City'));
  let name = '', color = COLORS[state.data.cities.length % COLORS.length];

  const nameGroup = formGroup('City Name');
  const nameInp = formInput('text', '', 'e.g. Tokyo, Venice…');
  nameInp.addEventListener('input', e => { name = e.target.value; });
  nameGroup.appendChild(nameInp);
  frag.appendChild(nameGroup);

  const colorGroup = formGroup('Color');
  const picker = el('div', { className: 'color-picker' });
  COLORS.forEach(c => {
    const swatch = el('div', { className: 'color-swatch' + (c === color ? ' selected' : ''), style: `background:${c}` });
    swatch.addEventListener('click', () => {
      color = c;
      picker.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      swatch.classList.add('selected');
    });
    picker.appendChild(swatch);
  });
  colorGroup.appendChild(picker);
  frag.appendChild(colorGroup);

  const footer = el('div', { className: 'modal-footer' });

  add.addEventListener('click', () => {
    if (!name.trim()) return;
    const newCity = { id: genId(), name: name.trim(), color,
      thingsToDo: { eat: [], see: [], buy: [] },
      transport: { type:'Flight', operator:'', flightNumber:'', departure:'', arrival:'', departureTime:'', arrivalTime:'', confirmation:'', notes:'' },
      accommodation: { name:'', address:'', doorCode:'', checkIn:'', checkOut:'', confirmationNumber:'', wifiName:'', wifiPassword:'', notes:'' },
      days: [] };
    state.data.cities.push(newCity);
    state.activeCityId = newCity.id;

  footer.appendChild(cancel);

  frag.appendChild(footer);
  return frag;

        confirmPending = true;
        delBtn.textContent = 'Tap again to confirm';
        delBtn.style.background = '#3a1a1a';
        delBtn.style.color = '#cc5555';
        delBtn.style.borderColor = '#cc5555';

          confirmPending = false;

            delBtn.style.color = '#884444';

function renderActivityModal({ cityId, dayId, activity }) {
  const city = state.data.cities.find(c => c.id === cityId);
  const day = city.days.find(d => d.id === dayId);
  const editing = !!activity;
  const frag = document.createDocumentFragment();
  frag.appendChild(el('h3', {}, editing ? 'Edit Activity' : 'Add Activity'));

  let form = editing
    ? { ...activity, duration: activity.duration || '', files: activity.files ? activity.files.map(f => ({...f})) : [] }
    : { time: '', duration: '', title: '', address: '', notes: '', link: '', files: [] };

  const grid = el('div', { className: 'grid-2' });

  const tg = formGroup('Start Time (e.g. 2:30 PM)');
  const ti = formInput('text', form.time || '', '2:30 PM');
  ti.addEventListener('input', e => { form.time = e.target.value; updatePreview(); });
  tg.appendChild(ti); grid.appendChild(tg);

  const ttg = formGroup('Title');
  const tti = formInput('text', form.title || '', 'e.g. Visit the Colosseum');
  tti.addEventListener('input', e => { form.title = e.target.value; });
  ttg.appendChild(tti); grid.appendChild(ttg);
  frag.appendChild(grid);

  // Duration + end time preview row
  const durGrid = el('div', { className: 'grid-2' });
  const durg = formGroup('Duration (e.g. 2h, 1h 30m)');
  const duri = formInput('text', form.duration || '', 'e.g. 1h 30m');
  duri.addEventListener('input', e => { form.duration = e.target.value; updatePreview(); });
  durg.appendChild(duri); durGrid.appendChild(durg);

  const previewG = formGroup('End Time');
  const previewEl = el('div', { style: 'font-size:15px;color:#aaa;padding:10px 12px;background:#111;border:1px solid #2a2a35;border-radius:8px;min-height:42px' }, '—');
  previewG.appendChild(previewEl); durGrid.appendChild(previewG);
  frag.appendChild(durGrid);

  // Duration + end time preview uses global calcActivityEndTime
  function updatePreview() {
    const end = calcActivityEndTime(form.time, form.duration);
    previewEl.textContent = end || '—';
    previewEl.style.color = end ? '#7AC67A' : '#aaa';
  }
  updatePreview();

  const ag = formGroup('Address (optional — opens in maps)');
  const ai = formInput('text', form.address || '', 'e.g. Via della Muratte, Rome');
  ai.addEventListener('input', e => { form.address = e.target.value; });
  ag.appendChild(ai); frag.appendChild(ag);

  const ng = formGroup('Notes');
  const na = el('textarea', { className: 'form-textarea', placeholder: 'Booking info, reminders…' });
  na.value = form.notes || '';
  na.addEventListener('input', e => { form.notes = e.target.value; });
  ng.appendChild(na); frag.appendChild(ng);

  const lnkg = formGroup('Link (optional)');
  const lnki = formInput('text', form.link || '', 'https://…');
  lnki.addEventListener('input', e => { form.link = e.target.value; });
  lnkg.appendChild(lnki); frag.appendChild(lnkg);

  // ── Attachments ──
  const fg = formGroup('Attachments (tickets, screenshots)');
  const fileWrap = el('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const fileListEl = el('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;min-height:0' });

  function renderFileThumbs() {
    while (fileListEl.firstChild) fileListEl.removeChild(fileListEl.firstChild);
    (form.files || []).forEach((f, i) => {
      const thumb = el('div', { style: 'position:relative;display:inline-block' });
      if (f.type && f.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.setAttribute('style', 'width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #333');
        img.src = f.url || f.data || '';
        thumb.appendChild(img);
      } else {
        thumb.appendChild(el('div', { style: 'width:60px;height:60px;border-radius:6px;border:1px solid #333;background:#1e1e28;display:flex;align-items:center;justify-content:center;font-size:24px' }, '📄'));
      }
      const removeBtn = el('button', { style: 'position:absolute;top:-6px;right:-6px;background:#cc5555;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;color:#fff;cursor:pointer;line-height:1;padding:0' }, '✕');
      removeBtn.addEventListener('click', e => {
        e.preventDefault();
        form.files.splice(i, 1);
        renderFileThumbs();
      });
      thumb.appendChild(removeBtn);
      fileListEl.appendChild(thumb);
    });
  }
  renderFileThumbs();
  fileWrap.appendChild(fileListEl);

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*,.pdf';
  fileInput.multiple = true;
  fileInput.style.cssText = 'display:none';
  fileInput.addEventListener('change', () => {
    const toLoad = Array.from(fileInput.files);
    if (toLoad.length === 0) return;

    uploadBtn.textContent = '⏳ Uploading…';
    uploadBtn.style.color = '#E8624A';

    let completed = 0;
    toLoad.forEach(file => {
      const path = `attachments/${genId()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const ref = storage.ref(path);
      const uploadTask = ref.put(file);

      uploadTask.on('state_changed',
        null,
        err => {
          console.error('Upload error:', err);
          completed++;
          if (completed === toLoad.length) {
            uploadBtn.textContent = '📎 Tap to attach file';
            uploadBtn.style.color = '#888';
            renderFileThumbs();
          }
        },
        async () => {
          const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
          if (!form.files) form.files = [];
          form.files.push({ name: file.name, type: file.type, url: downloadURL, path });
          completed++;
          if (completed === toLoad.length) {
            uploadBtn.textContent = '📎 Tap to attach file';
            uploadBtn.style.color = '#888';
            renderFileThumbs();
          }
        }
      );
    });
    fileInput.value = '';
  });
  fileWrap.appendChild(fileInput);

  const uploadBtn = el('button', { style: 'background:#1e1e28;border:1px dashed #444;border-radius:8px;color:#888;font-size:13px;padding:10px;cursor:pointer;text-align:center;width:100%' }, '📎 Tap to attach file');
  uploadBtn.addEventListener('click', e => { e.preventDefault(); fileInput.click(); });
  fileWrap.appendChild(uploadBtn);
  fg.appendChild(fileWrap);
  frag.appendChild(fg);

  const footer = el('div', { className: 'modal-footer' });
  const cancel = makeBtn('Cancel', null, false, 'secondary');
  cancel.addEventListener('click', closeModal);
  const save_ = makeBtn(editing ? 'Save Changes' : 'Add Activity', city.color);
  save_.addEventListener('click', () => {
    if (!form.title.trim()) return;
    if (editing) {
      Object.assign(activity, form);
    } else {
      day.activities.push({ id: genId(), ...form });
    }
    save(); closeModal();
  });
  footer.appendChild(cancel);
  footer.appendChild(save_);
  frag.appendChild(footer);
  return frag;
}

// ── Helpers ──
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'className') e.className = v;
    else if (k === 'style' && typeof v === 'string') e.setAttribute('style', v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  });
  if (text !== undefined) e.textContent = text;
  return e;
}

function formGroup(label) {
  const g = el('div', { className: 'form-group' });
  g.appendChild(el('label', { className: 'form-label' }, label));
  return g;
}

function formInput(type, value, placeholder) {
  return el('input', { type, className: 'form-input', value: value || '', placeholder: placeholder || '' });
}

function makeBtn(text, color, small = false, variant = 'primary') {
  const btn = el('button', { className: 'btn' + (small ? ' btn-sm' : '') + (variant === 'secondary' ? ' btn-secondary' : ' btn-primary') }, text);
  if (variant === 'primary' && color) btn.style.background = color;
  return btn;
}

function appendInfoField(parent, label, value, mono = false) {
  if (!value) return;
  const field = el('div', { className: 'info-field' });
  field.appendChild(el('div', { className: 'info-label' }, label));
  field.appendChild(el('div', { className: 'info-value' + (mono ? ' mono' : '') }, value));
  parent.appendChild(field);
}

// ── Boot ──
try {
  const app = document.getElementById('app');
  const loading = document.createElement('div');
  loading.setAttribute('style', 'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0E0E12;');
  loading.innerHTML = '<div style="font-size:48px;margin-bottom:16px">🍾</div><div style="color:#444;font-size:14px">Loading itinerary…</div>';
  app.appendChild(loading);

  // Start Firebase sync
  startFirebaseSync();

  // Fallback after 2 seconds if Firebase hasn't responded
  setTimeout(() => {
    if (!firebaseInitialized) {
      console.warn('Firebase timeout — rendering with default data');
      firebaseInitialized = true;
      render();
    }
  }, 2000);
} catch(e) {
  console.error('Boot error:', e);
  render();
}
